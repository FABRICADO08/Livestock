<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Livestock - Livestock Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 800px; }
        .card { border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); }
        .card-header { font-size: 1.25rem; font-weight: bold; }
        /* Keep the form hidden until the session is verified so
           unauthenticated visitors never see it flash before redirecting */
        #auth-checking {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: #f8f9fa;
            color: #6b7a8d;
            font-weight: 600;
        }
        .page-content { visibility: hidden; }
        body.auth-ready .page-content { visibility: visible; }
        body.auth-ready #auth-checking { display: none; }
    </style>
</head>
<body>

    <div id="auth-checking" role="status" aria-live="polite">
        <div class="spinner-border text-primary" aria-hidden="true"></div>
        <span>Loading…</span>
    </div>

    <div class="container mt-4 page-content" aria-hidden="true">
        <header class="text-center mb-4">
            <h1 class="display-5 fw-bold">Livestock Management Dashboard</h1>
            <p class="text-muted">Track and manage your livestock records efficiently</p>
        </header>

        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span id="form-title">Add New Livestock</span>
                <a href="index.html" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-arrow-left"></i> Back to Records
                </a>
            </div>
            <div class="card-body">
                <div class="alert alert-info py-2" id="form-user-hint">Sign in with Google to add records.</div>
                <form id="livestock-form">
                    <input type="hidden" id="livestock-id">

                    <div class="mb-3">
                        <label for="species" class="form-label fw-bold">Species</label>
                        <select class="form-select" id="species" required>
                            <option value="" selected disabled>Choose Species...</option>
                            <option value="Cattle">Cattle</option>
                            <option value="Sheep">Sheep</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="breed" class="form-label fw-bold">Breed</label>
                        <select class="form-select" id="breed" required disabled>
                            <option value="" selected disabled>Select species first...</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="gender" class="form-label fw-bold">Gender</label>
                            <select class="form-select" id="gender" required>
                                <option value="" selected disabled>Select Gender...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="classification" class="form-label fw-bold">Type</label>
                            <select class="form-select" id="classification" required></select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="age" class="form-label fw-bold">Age (years)</label>
                            <input type="number" class="form-control" id="age" min="0" readonly required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="weight" class="form-label fw-bold">Weight (kg)</label>
                            <input type="number" step="0.1" class="form-control" id="weight" min="0" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="health-status" class="form-label fw-bold">Health Status</label>
                        <select class="form-select" id="health-status">
                            <option value="Healthy">Healthy</option>
                            <option value="Sick">Sick</option>
                            <option value="Under Treatment">Under Treatment</option>
                            <option value="Quarantined">Quarantined</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="date-of-birth" class="form-label fw-bold">Date of Birth</label>
                            <input type="date" class="form-control" id="date-of-birth" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="acquisition-date" class="form-label fw-bold">Acquisition Date</label>
                            <input type="date" class="form-control" id="acquisition-date">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="production-type" class="form-label fw-bold">Production Type</label>
                            <select class="form-select" id="production-type">
                                <option value="">Select Type...</option>
                                <option value="Meat">Meat</option>
                                <option value="Dairy">Dairy</option>
                                <option value="Breeding">Breeding</option>
                                <option value="Wool">Wool</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="vaccination-status" class="form-label fw-bold">Vaccination Status</label>
                            <select class="form-select" id="vaccination-status">
                                <option value="">Select...</option>
                                <option value="Vaccinated">Vaccinated</option>
                                <option value="Pending">Pending</option>
                                <option value="Not Vaccinated">Not Vaccinated</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="location" class="form-label fw-bold">Location/Pen</label>
                            <input type="text" class="form-control" id="location" placeholder="e.g., Pasture A">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="id-tag" class="form-label fw-bold">ID Tag/Ear Tag</label>
                            <input type="text" class="form-control" id="id-tag" placeholder="e.g., EAR-001">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label fw-bold">Asking Price (R)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="price" placeholder="e.g., 5200">
                        </div>
                        <div class="col-md-6 mb-3 d-flex align-items-end">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="for-sale" checked>
                                <label class="form-check-label fw-bold" for="for-sale">List for sale in marketplace</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label fw-bold">Notes</label>
                        <textarea class="form-control" id="notes" rows="2" placeholder="Additional notes..."></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success" id="submit-btn">Save Livestock</button>
                        <a href="index.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="add-livestock.js"></script>
</body>
</html>
