spring:
  data:
    mongodb:
      # Uses the MONGO_URI environment variable (set on Render); falls back to a local MongoDB
      uri: ${MONGO_URI:mongodb://localhost:27017/livestock}
  servlet:
    session:
      cookie:
        same-site: lax
  mail:
    # SMTP settings for purchase/owner notification emails. Set these as
    # environment variables (e.g. on Render). When MAIL_HOST is unset, email
    # sending is skipped silently.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # Sender address for notification emails (From: header)
    from: ${MAIL_FROM:not-reply.livestockmanegemnt@gmail.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
